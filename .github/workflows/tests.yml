name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU torch: the GPU wheel is gigabytes and nothing here needs it.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install gymnasium numpy matplotlib pytest

      - run: pytest -q
